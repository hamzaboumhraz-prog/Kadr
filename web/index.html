/*
VOICE: a working editing suite — warm, focused, a little theatrical, like the video's film-strip room.
IDEA: a director's monitor over a cutting bench; the timeline is the editor's V1 track with clips and cut marks.
PICTURE: the live 3D monitor (camera view + director's picture-in-picture) is the first thing you see.
COLOUR and TYPE: deep oxblood room, cream ink, amber for selection, cream/sand/orange clips by shot size, cyan for action. Noto Kufi for titles, IBM Plex Sans Arabic for UI.
LAYOUT: control panel at the start side, monitor + transport + timeline beside it; on phones the monitor sticks to the top.
*/

:root{color-scheme:dark;--bg:#1c0e0c;--bg2:#231210;--pan:#2c1714;--pan2:#381e1a;--line:#4d2c25;--ink:#f5e9db;--mut:#c9ad9b;--dim:#93766a;--amb:#f2a23a;--cream:#efe3cf;--sand:#e0b46f;--orng:#ef7f37;--cyan:#79c4e6;--ok:#5ad08a;--bad:#ff6a5f;--warn:#ffc24a;--r:12px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
bdi{unicode-bidi:isolate}
h1,h2,h3{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif;margin:0}
#app{display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "side stage" "side tl";height:100vh;height:100dvh}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#2a1411,#1f0f0d)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:none}
.brand h1{font-size:24px;line-height:1.05;letter-spacing:0}
.brand p{margin:2px 0 0;color:var(--mut);font-size:13px}
.hb{display:flex;gap:6px;flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--pan);transition:background .15s}
.ib:hover{background:var(--pan2)}.ib:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.ib svg{width:18px;height:18px;flex:none}
.ib[disabled]{opacity:.4;cursor:default}
.stage{grid-area:stage;display:flex;flex-direction:column;min-height:0;padding:12px 14px 0;gap:8px}
.mon{position:relative;flex:1;min-height:240px;background:#0b0505;border-radius:14px;overflow:hidden;border:1px solid #3a201b;touch-action:none;user-select:none;-webkit-user-select:none}
.mon::before,.mon::after{content:"";position:absolute;top:0;bottom:0;width:14px;z-index:1;pointer-events:none;background:repeating-linear-gradient(#0b0505 0 8px,#2b1714 8px 18px);opacity:.9}
.mon::before{left:0}.mon::after{right:0}
#cv,#mix{position:absolute;inset:0;width:100%;height:100%;display:block}
#mix{pointer-events:none;opacity:0}
.frame{position:absolute;pointer-events:none;z-index:2}
.thirds{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% - .5px) calc(66.66% + .5px),transparent 0),linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% - .5px) calc(66.66% + .5px),transparent 0)}
.safe{position:absolute;inset:10% 10%;border:1px dashed rgba(255,255,255,.35)}
.tc{position:absolute;top:10px;left:10px;font-size:13px;font-variant-numeric:tabular-nums;background:rgba(15,7,6,.72);padding:3px 9px;border-radius:7px;display:flex;align-items:center;gap:6px}
.tc::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff4b3e}
.shotlbl{position:absolute;bottom:10px;right:10px;max-width:calc(100% - 20px);display:flex;flex-wrap:wrap;gap:5px;direction:rtl}
.shotlbl span{background:rgba(15,7,6,.78);border-radius:7px;padding:2px 8px;font-size:13px;white-space:nowrap}
.shotlbl .k{background:var(--amb);color:#1c0e0c;font-weight:700}
.shotno{position:absolute;top:10px;right:10px;font-size:13px;background:rgba(15,7,6,.72);padding:3px 9px;border-radius:7px}
.fade{position:absolute;inset:0;background:#000;opacity:0}
.pip{position:absolute;z-index:3;padding:0;border:2px solid var(--amb);border-radius:8px;background:transparent;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.pip span{position:absolute;top:-1px;right:-1px;background:var(--amb);color:#1c0e0c;font-size:12px;font-weight:700;padding:1px 7px;border-radius:0 6px 0 6px;white-space:nowrap}
.hint{position:absolute;z-index:3;top:44px;left:50%;transform:translateX(-50%);background:rgba(15,7,6,.85);border:1px solid var(--line);padding:6px 12px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.hint.show{opacity:1}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);z-index:2}
.srcbar{position:absolute;z-index:3;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:rgba(15,7,6,.85);border:1px solid var(--amb);border-radius:10px;padding:3px 4px 3px 10px;font-size:13px;white-space:nowrap}
.srcbar.show{display:flex}
.srcbar button{border:0;background:var(--amb);color:#1c0e0c;border-radius:7px;padding:4px 10px;font-weight:600;min-height:30px}
.transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;max-width:100%}
.transport .play{background:var(--amb);color:#1c0e0c;border-color:var(--amb);min-width:52px}
.tcb{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;padding:0 6px;white-space:nowrap}
.tcb b{color:var(--ink);font-weight:600}
.grow{flex:1}
.ib.on{background:var(--amb);color:#1c0e0c;border-color:var(--amb)}
/* timeline */
.tl{grid-area:tl;padding:8px 12px 10px;background:#170a09;border-top:1px solid var(--line);margin-top:10px;--lw:108px}
.tlbar{display:flex;align-items:center;gap:5px;margin-bottom:7px;overflow-x:auto;scrollbar-width:none}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--pan);font-size:13px;white-space:nowrap;flex:none}
.tb.sq{padding:0;width:36px}.tb svg{width:17px;height:17px}.tb[disabled]{opacity:.38;cursor:default}.tb:not([disabled]):hover{background:var(--pan2)}
.tsc{overflow:auto;max-height:clamp(150px,28vh,270px);background:#1f0f0d;border-radius:10px;position:relative;overscroll-behavior:contain;scrollbar-width:thin}
.tin{position:relative}
.trow{position:relative;height:38px;border-bottom:1px solid #2b1613}
.trow.ruler{height:24px;position:sticky;top:0;z-index:6;background:#1f0f0d;cursor:ew-resize;touch-action:none;border-bottom-color:#3a201b}
.trow.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid #4d2c25;font-style:normal}
.trow.ruler i b{position:absolute;top:3px;left:4px;font-size:11px;color:var(--dim);font-weight:500}
.trow.ruler i.h{top:15px}
.lab{position:sticky;left:0;z-index:5;height:100%;width:var(--lw);display:flex;align-items:center;gap:6px;padding:0 7px;background:#241210;border-right:1px solid var(--line);direction:rtl;font-size:12.5px;color:var(--mut);cursor:pointer}
.trow.ruler .lab{z-index:7;cursor:default}
.lab>i{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
.lab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab .add{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--pan2);color:var(--amb);font-weight:700;font-size:17px;line-height:1;padding:0;flex:none}
.trow.trk.on .lab{color:var(--ink);background:#36191a}
.trow.trk.on{background:rgba(242,162,58,.05)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;font-size:12px;color:#2a140f;cursor:pointer;border:2px solid transparent;direction:rtl;z-index:2;touch-action:none}
.clip.c0{background:var(--cream)}.clip.c1{background:var(--sand)}.clip.c2{background:var(--orng)}
.clip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--amb)}
.clip.drag{opacity:.85;z-index:8;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.clip b{font-weight:700}.clip .cd{width:8px;height:8px;border-radius:50%;flex:none}
.cut{position:absolute;top:-2px;bottom:-2px;width:20px;margin-left:-10px;cursor:ew-resize;z-index:3;display:flex;justify-content:center;touch-action:none}
.cut::before{content:"";width:2px;background:#fff;opacity:.9}
.cut .fl{position:absolute;top:-1px;min-width:17px;height:15px;border-radius:8px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;color:#1c0e0c;background:#cbb}
.cut.ok .fl{background:var(--ok)}.cut.bad .fl{background:var(--bad)}.cut.warn .fl{background:var(--warn)}
.endh{position:absolute;top:4px;bottom:4px;width:16px;margin-left:-8px;cursor:ew-resize;z-index:3;touch-action:none}
.endh::after{content:"";position:absolute;inset:5px 6px;border-radius:2px;background:rgba(255,255,255,.6)}
.act{position:absolute;top:6px;bottom:6px;border-radius:9px;background:repeating-linear-gradient(-45deg,#79c4e6 0 6px,#62b4da 6px 12px);color:#0d2532;font-size:11.5px;font-weight:600;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:grab;direction:rtl;z-index:2;touch-action:none;border:2px solid transparent}
.act span{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.act.sel{border-color:#fff;box-shadow:0 0 0 2px var(--amb)}
.act .th{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize}
.act .th.l{left:0}.act .th.r{right:0}
.act.sel .th::after{content:"";position:absolute;top:22%;bottom:22%;width:3px;border-radius:2px;background:#0d2532;left:4px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ffd36b;left:0;z-index:4;pointer-events:none}
.ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #ffd36b}
/* popover & floating toolbar */
.pop{position:fixed;z-index:220;background:#2c1714;border:1px solid #5a3229;border-radius:14px;padding:10px;box-shadow:0 14px 36px rgba(0,0,0,.55);max-width:min(360px,calc(100vw - 16px));direction:rtl}
.pop[hidden]{display:none}
.pop .pt{font-size:13px;color:var(--mut);margin:0 2px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pop .pt b{color:var(--ink)}
.pop .px{margin-inline-start:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--pan2);font-size:20px;line-height:1;padding:0;color:var(--ink)}
.pop .pgh{font-size:12px;color:var(--amb);margin:10px 2px 5px;font-weight:600}
.pop{max-height:min(70vh,560px);overflow-y:auto}
.pop .pr{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.pop .pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pop .pv{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.pop select{width:auto;min-height:36px;padding:2px 8px;font-size:14px}
.pb{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--pan2);font-size:13px;line-height:1.2}
.pb.sq{width:38px;padding:0;justify-content:center}.pb svg{width:16px;height:16px;flex:none}
.pb.on{background:var(--amb);color:#1c0e0c;border-color:var(--amb)}.pb.danger{color:#ffb1a8}
.pb.cam i{width:8px;height:8px;border-radius:50%}.pb.cam small{opacity:.75;font-size:11.5px}
.ctx{position:absolute;z-index:6;left:0;top:0;display:flex;align-items:center;gap:2px;padding:4px;background:rgba(30,14,12,.94);border:1px solid #5a3229;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.5);direction:rtl;max-width:calc(100% - 12px);overflow-x:auto;scrollbar-width:none}
.ctx[hidden]{display:none}
.ctx{transition:opacity .25s}.ctx.gone{opacity:0;pointer-events:none}
.ctx .cn{font-size:12.5px;padding:0 8px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.ctx button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:42px;min-height:42px;padding:2px 4px;border:0;border-radius:9px;background:transparent;font-size:10.5px;color:var(--ink);flex:none}
.ctx button:hover{background:var(--pan2)}.ctx button svg{width:18px;height:18px}.ctx button.danger{color:#ffb1a8}
.exp .bar{height:10px;border-radius:6px;background:#1a0c0a;border:1px solid var(--line);overflow:hidden}.exp .bar i{display:block;height:100%;width:0;background:var(--amb);transition:width .15s}
@media (max-width:600px){.ctx button span{display:none}.ctx button{min-width:40px}.tb span{display:none}.tb{padding:0 9px}}
/* side panel */
.side{grid-area:side;display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-inline-end:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line);background:#1f0f0d}
.tabs button{border:0;background:transparent;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--mut);border-bottom:3px solid transparent;min-height:56px}
.tabs button svg{width:20px;height:20px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amb);background:var(--pan)}
.panel{flex:1;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:thin}
.panel section{padding:14px 0;border-bottom:1px solid #3a201b}
.panel section:last-child{border-bottom:0}
.panel h3{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h3 small{font:500 12px "IBM Plex Sans Arabic",sans-serif;color:var(--dim)}
.note{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:5px 11px;border-radius:10px;border:1px solid var(--line);background:var(--pan);display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:1.25}
.chip:hover{background:var(--pan2)}
.chip.on{background:var(--amb);border-color:var(--amb);color:#1c0e0c;font-weight:600}
.chip small{font-size:12px;opacity:.8}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.grid2,.grid3,.grid5{display:grid;gap:6px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--pan);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;font-size:13.5px;text-align:center;line-height:1.25}
.tile:hover{background:var(--pan2)}
.tile.on{border-color:var(--amb);background:#4a2a1a;box-shadow:inset 0 0 0 1px var(--amb)}
.tile b{font-size:15px;font-weight:700}
.tile .ab{font-size:13px;font-weight:700;color:var(--amb)}
.tile.on .ab{color:#ffd28a}
.tile svg{width:30px;height:30px}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.18);display:block}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.15);padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--amb)}
.swatches input[type=color]{width:34px;height:34px;padding:0;border:0;background:none;border-radius:50%}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;margin:10px 0}
.row>span{color:var(--mut);font-size:13.5px}
.rng{display:grid;grid-template-columns:92px minmax(0,1fr) 64px;gap:10px;align-items:center;margin:8px 0}
.rng span{color:var(--mut);font-size:13.5px}
.rng output{font-variant-numeric:tabular-nums;font-size:13.5px;text-align:end;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--amb);height:30px}
select,input[type=text],input[type=number],textarea{background:#1a0c0a;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:16px;min-height:40px;width:100%}
input[type=number]{direction:ltr;text-align:center;padding:4px;width:64px}
.card{background:#1a0c0a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.card b{display:block;font-size:14.5px}
.card bdi{color:var(--dim);font-weight:500;font-size:12.5px}
.card p{margin:4px 0 0;font-size:13.5px;color:var(--mut)}
.card .use{color:var(--ink)}
.btn{min-height:42px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--pan);font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--pan2)}
.btn.pri{background:var(--amb);color:#1c0e0c;border-color:var(--amb)}
.btn.danger{color:#ffb1a8}
.btn svg{width:18px;height:18px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.edh{display:flex;gap:6px;align-items:center}
.edh input{flex:1}
.actrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:#1a0c0a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.actrow .at{font-weight:600;font-size:14px}
.actrow .ap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut);grid-column:1/-1}
.actrow .ap label{display:inline-flex;align-items:center;gap:4px}
.addact{display:flex;gap:6px;margin-top:8px}
.addact select{flex:1}
.shotrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#1a0c0a;margin:6px 0;cursor:pointer}
.shotrow.sel{border-color:var(--amb);box-shadow:inset 0 0 0 1px var(--amb)}
.shotrow .n{font:800 18px "Noto Kufi Arabic",sans-serif;color:var(--amb);text-align:center}
.shotrow .meta{font-size:13.5px}
.shotrow .meta b{font-size:14.5px}
.shotrow .ctr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.mini{min-height:34px;min-width:34px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:var(--pan);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.mini svg{width:16px;height:16px}
.mini.on{background:var(--amb);color:#1c0e0c}
.flag{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;border-bottom:1px dashed #3a201b}
.flag i{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px;color:#1c0e0c}
.flag i.ok{background:var(--ok)}.flag i.bad{background:var(--bad)}.flag i.warn{background:var(--warn)}.flag i.info{background:#cbb}
.lesson{padding:12px;border-radius:12px;border:1px solid var(--line);background:#1a0c0a;margin:8px 0}
.lesson h4{margin:0 0 4px;font:700 15.5px "Noto Kufi Arabic",sans-serif}
.lesson p{margin:0 0 8px;font-size:13.5px;color:var(--mut)}
.lesson .meta{font-size:12.5px;color:var(--dim);margin-bottom:8px}
.lesson.on{border-color:var(--amb)}
.rules{margin:0;padding:0 18px 0 0;font-size:13.5px;color:var(--mut)}
.rules li{margin:6px 0}.rules b{color:var(--ink)}
.quiz{background:#1a0c0a;border:1px solid var(--line);border-radius:12px;padding:12px}
.quiz .q{font-weight:600;margin-bottom:8px}
.quiz .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.quiz .opts .chip{justify-content:center}
.quiz .chip.right{background:var(--ok);color:#0c2416;border-color:var(--ok)}
.quiz .chip.wrong{background:var(--bad);color:#2a0c0a;border-color:var(--bad)}
.quiz .fb{margin-top:8px;font-size:13.5px;color:var(--mut)}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:260;background:rgba(10,4,3,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:min(1100px,100%);max-height:92vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px}
.mbody{overflow:auto;padding:14px 16px 18px}
.sb{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sbc{background:#f4ecdf;color:#2a1611;border-radius:10px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.sbc img{width:100%;display:block;border-radius:4px;border:2px solid #2a1611;background:#000}
.sb.sketch .sbc img{filter:grayscale(1) contrast(1.6) brightness(1.15)}
.sbc h4{margin:6px 0 2px;font:700 15px "Noto Kufi Arabic",sans-serif;display:flex;justify-content:space-between}
.sbc p{margin:0;font-size:13px;line-height:1.45}
.toast{position:fixed;z-index:300;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#f5e9db;color:#1c0e0c;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
textarea{min-height:220px;direction:ltr;font:13px/1.4 ui-monospace,monospace}
/* cinema */
body.cine .mon{position:fixed;inset:0;z-index:150;border-radius:0;border:0;min-height:0;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto}
body.cine .hint,body.cine .srcbar{display:none}
body.cine .mon::before,body.cine .mon::after,body.cine .pip{display:none}
body.cine .transport{position:fixed;z-index:160;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(20,8,6,.8);padding:6px;border-radius:14px;flex-wrap:nowrap}
body.cine .transport .opt{display:none}
/* full-screen editing */
.sui{display:none}
body.stage .mon{position:fixed;inset:0;z-index:150;border-radius:0;border:0;min-height:0;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto}
body.stage .mon::before,body.stage .mon::after{display:none}
body.stage .sui{display:block}
body.stage.cine .sui{display:none}
body.stage .tc,body.stage .shotno,body.stage .srcbar{top:66px}
body.stage .hint{top:66px}
body.stage .shotlbl{bottom:84px}
body.stage.camstrip .shotlbl{bottom:136px}
.sui .st-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:8;pointer-events:none;direction:rtl}
.sui .st-top>*{pointer-events:auto}
.sui .st-r{display:flex;gap:6px}
.sui .st-bot{position:absolute;bottom:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(24,11,9,.86);border:1px solid #5a3229;border-radius:14px;z-index:8;direction:rtl}
.sui .sbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #5a3229;background:rgba(36,18,16,.9);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;flex:none}
.sui .sbtn svg,.sui .seg svg{width:19px;height:19px}
.sui .sbtn.pl{background:var(--amb);color:#1c0e0c;border-color:var(--amb)}
.sui input[type=range]{flex:1;min-width:70px;direction:ltr;height:36px}
.sui .stc{font-variant-numeric:tabular-nums;font-size:13px;min-width:44px;text-align:center;flex:none}
.sui .scams{display:flex;gap:4px;overflow-x:auto;max-width:38%;scrollbar-width:none;flex:none}
.sui .scams button{min-height:40px;padding:0 10px;border-radius:10px;border:1px solid #5a3229;background:rgba(36,18,16,.9);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.sui .scams button.on{background:var(--amb);color:#1c0e0c;border-color:var(--amb)}
.sui .scams i{width:8px;height:8px;border-radius:50%}
.sui .seg{display:flex;background:rgba(36,18,16,.9);border:1px solid #5a3229;border-radius:12px;overflow:hidden}
.sui .seg button{min-height:44px;padding:0 12px;border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.sui .seg button.on{background:var(--amb);color:#1c0e0c}
.sui .st-cam{position:absolute;bottom:74px;left:10px;right:10px;display:flex;align-items:center;gap:6px;padding:5px 8px;background:rgba(24,11,9,.86);border:1px solid #5a3229;border-radius:12px;z-index:8;direction:rtl;overflow-x:auto;scrollbar-width:none}
.sui .st-cam b{font-size:13px;white-space:nowrap;color:var(--amb)}
.sui .st-cam select{width:auto;min-height:38px;padding:2px 8px;font-size:14px;flex:none}
body.stage .toast{bottom:150px}
body.stage .srcbar{display:none!important}
@media (max-width:640px){.sui .stc,.sui .seg span,.sui .add span,.sui .st-cam b{display:none}.sui .st-bot{gap:5px;padding:5px;flex-wrap:wrap}.sui .scams{order:-1;flex-basis:100%;max-width:none}.sui .st-cam{bottom:122px}body.stage .shotlbl,body.stage.camstrip .shotlbl{bottom:10px}body.stage .toast{bottom:200px}}
@media (max-width:1100px){#app{grid-template-columns:350px minmax(0,1fr)}}
@media (max-width:899px){
  #app{display:block;height:auto}
  .top{padding:8px 12px}.brand h1{font-size:20px}.brand p{display:none}.logo{width:34px;height:34px}
  .top .lt{display:none}.top .ib{padding:0 9px}
  .lab>i{display:none}
  .stage{position:sticky;top:0;z-index:40;padding:0;background:var(--bg);gap:0;box-shadow:0 8px 16px rgba(0,0,0,.35)}
  .mon{flex:none;aspect-ratio:16/9;min-height:0;border-radius:0;border:0;border-bottom:1px solid #3a201b}
  .mon::before,.mon::after{display:none}
  .transport{padding:6px 8px;gap:4px;flex-wrap:nowrap;overflow:hidden}
  .tcb{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
  .transport .ib{min-height:40px;min-width:38px;padding:0 7px}
  .shotlbl .x{display:none}
  .transport .lt{display:none}
  .tl{margin-top:0;padding:8px 8px 10px}
  .tabs{position:sticky;top:var(--stk,270px);z-index:30}
  .tabs button{font-size:11.5px;min-height:52px}
  .panel{overflow:visible;padding:4px 14px 80px}
  .rng{grid-template-columns:80px minmax(0,1fr) 58px}.row{grid-template-columns:80px minmax(0,1fr)}
}
@media (max-width:430px){.grid5{grid-template-columns:repeat(4,minmax(0,1fr))}.tcb{font-size:12.5px;padding:0 2px}#bLoop{display:none}}
@media (prefers-reduced-motion:reduce){.stamp,.toast,.hint{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="7" width="36" height="26" rx="5" fill="#f2a23a"/><rect x="6" y="11" width="28" height="18" rx="2" fill="#1c0e0c"/><path d="M6 17v-6h6M34 17v-6h-6M6 23v6h6M34 23v6h-6" stroke="#f2a23a" stroke-width="2" fill="none"/><circle cx="20" cy="20" r="3.2" fill="#ef7f37"/></svg>
      <div><h1>كادر</h1><p>مختبر اللغة السينمائية: ابنِ المشهد، ضع الكاميرا، ركّب</p></div>
    </div>
    <div class="hb">
      <button class="ib" id="bUndo" title="تراجع" aria-label="تراجع"></button>
      <button class="ib" id="bRedo" title="إعادة" aria-label="إعادة"></button>
      <button class="ib" id="bBoard" title="لوحة القصة"><span class="lt">لوحة القصة</span></button>
      <button class="ib" id="bExport" title="تصدير فيديو"></button>
    </div>
  </header>
  <section class="stage">
    <div class="mon" id="mon">
      <canvas id="cv"></canvas><canvas id="mix"></canvas>
      <div class="frame" id="frame">
        <div class="thirds" id="thirds"></div><div class="safe" id="safe" hidden></div>
        <div class="fade" id="fade"></div>
        <div class="tc" id="tc" dir="ltr">00:00:00:00</div>
        <div class="shotno" id="shotno"></div>
        <div class="shotlbl" id="shotlbl"></div>
      </div>
      <button class="pip" id="pip" aria-label="تبديل العرض"><span id="pipl"></span></button>
      <div class="ctx" id="ctx" hidden></div>
      <div class="sui" id="sui"></div>
      <div class="srcbar" id="srcbar"><span id="srct"></span><button id="srcBack">عرض المونتاج</button></div>
      <div class="hint" id="hint"></div>
      <div class="empty" id="empty"></div>
    </div>
    <div class="transport" id="transport">
      <button class="ib" id="bStart" aria-label="إلى البداية"></button>
      <button class="ib" id="bPrev" aria-label="القطع السابق"></button>
      <button class="ib play" id="bPlay" aria-label="تشغيل"></button>
      <button class="ib" id="bNext" aria-label="القطع التالي"></button>
      <div class="tcb" dir="ltr"><b id="tcBig">0.0</b> / <span id="tcTot">0.0</span> s</div>
      <div class="grow"></div>
      <button class="ib opt" id="bLoop" aria-label="تكرار"></button>
      <button class="ib opt" id="bView"></button>
      <button class="ib" id="bCine"></button>
    </div>
  </section>
  <section class="tl" id="tl" dir="ltr"></section>
  <aside class="side">
    <nav class="tabs" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </aside>
</div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><h2 id="mt"></h2><button class="btn" id="mx">إغلاق</button></div><div class="mbody" id="mb"></div></div></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="lib/three.min.js"></script>
<script src="lib/mp4-muxer.js"></script>
<script src="data.js"></script>
<script src="world.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="tl.js"></script>
<script src="export.js"></script>
<script>boot();</script>
</body>
</html>
