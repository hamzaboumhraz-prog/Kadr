plugins { id 'com.android.application' }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
  namespace 'ma.oslob.kadr'
  compileSdk 34
  defaultConfig {
    applicationId "ma.oslob.kadr"
    minSdk 24
    targetSdk 34
    versionCode run
    versionName "1." + run
  }
  signingConfigs {
    kadr {
      storeFile file("kadr.keystore")
      storePassword "kadr-oslob"
      keyAlias "kadr"
      keyPassword "kadr-oslob"
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.kadr }
    debug { signingConfig signingConfigs.kadr }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  lint { checkReleaseBuilds false; abortOnError false }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
